name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v2.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$TAG' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          gh release create "$TAG" publish/TextTyper.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TextTyper ${TAG#v}" \
            --notes "$(cat <<'EOF'
          Rewrite of the SendKeys app.

          - SendInput / KEYEVENTF_UNICODE, so +, ^, %, ~, and braces type as themselves
          - Newlines become Enter (uncheck to send a literal line feed); tabs become Tab
          - Countdown, per-character delay, and jitter
          - Escape cancels after focus leaves the window

          TextTyper.exe is a self-contained win-x64 build. No .NET install required.
          A non-elevated process still cannot type into an elevated window.
          EOF
          )"
